<style>
/* Una columna para celular; barra inferior por rol; acciones principales como botones grandes */
:root{
  --bg:#eef2f4; --card:#fff; --fg:#17232b; --muted:#5a6b75; --line:#d3dde2;
  --accent:#0f6b6e; --accent-soft:#dbefee; --mark:#f2b134; --ok:#2e7d4f; --ok-soft:#dff1e6; --bad:#b3402f; --bad-soft:#f8e1dc;
  --warn:#8a5a00; --warn-soft:#fbefd5;
  --display:"Bitter",Georgia,serif; --body:"Lexend",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10181c; --card:#18242a; --fg:#e4ecef; --muted:#93a6af; --line:#2a3a42;
  --accent:#4cc0c2; --accent-soft:#173a3c; --ok:#5cc28a; --ok-soft:#173326; --bad:#e8826f; --bad-soft:#3a1f1a;
  --warn:#f2b134; --warn-soft:#3a2e12; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body{padding:calc(12px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
body.sinbarra{padding-bottom:32px}
body.noscroll{overflow:hidden}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:1.25rem;margin:0;line-height:1.2;text-wrap:balance}
h2{font-family:var(--display);font-size:1.08rem;margin:0}
h3{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top small{display:block;font-family:var(--body);font-size:.78rem;color:var(--muted);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{font:inherit;font-size:.95rem;font-weight:500;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.warn{color:var(--bad);border-color:var(--bad)}
.btn.full{width:100%}
.btn.big{min-height:56px;font-size:1.05rem}
.btn.xl{min-height:68px;font-size:1.12rem;border-radius:18px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.55}
.btn svg{width:24px;height:24px;flex:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
input,select{font:inherit;font-size:16px;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);width:100%}
label.f,div.f{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:500}
.form{display:flex;flex-direction:column;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none;object-fit:cover;background:var(--accent);font-size:.9rem}
.av.lg{width:84px;height:84px;border-radius:16px;font-size:1.4rem}
.av.xl{width:96px;height:96px;border-radius:18px;font-size:1.6rem}
.av.gr{background:var(--accent-soft);color:var(--accent);font-size:.8rem}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
div.item{cursor:default}
.item:last-child{border-bottom:0}
.item b{display:block;font-weight:500}
.item span.s{display:block;font-size:.84rem;color:var(--muted)}
.chev{color:var(--muted);flex:none}
.pill{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill svg{width:14px;height:14px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.gris{background:var(--bg);color:var(--muted)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.88rem;letter-spacing:.03em;word-break:break-all}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qr{background:#fff;padding:12px;border-radius:14px;line-height:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{font:inherit;font-size:.9rem;font-weight:500;min-height:40px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);white-space:nowrap;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.chips.envolver{flex-wrap:wrap;overflow:visible}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{font:inherit;font-size:.9rem;font-weight:500;min-height:44px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px}
.seg button svg{width:20px;height:20px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.tres{grid-template-columns:repeat(3,1fr)}
.seg.tres button{min-height:40px;font-size:.84rem}
.seg button.falta[aria-pressed="true"]{background:var(--bad);color:#fff}
.seg button.trans[aria-pressed="true"]{background:var(--accent);color:var(--card)}
.asis{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.asis b{font-weight:500;display:block}.asis .s{font-size:.84rem;color:var(--muted);display:block}
.fotoprev{width:100%;max-width:180px;border-radius:14px;align-self:center;border:2px solid var(--line)}
.otra{border:2px solid var(--mark)}
a.btn{text-decoration:none}.btn.wa{color:#128c4a;border-color:#128c4a}.btn.wa svg{width:20px;height:20px}
a.mini{font-size:.82rem;color:#128c4a;font-weight:600;display:inline-flex;gap:4px;align-items:center}a.mini svg{width:16px;height:16px}
.barra{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}.barra i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tblest{width:100%;border-collapse:collapse;font-size:.84rem}.tblest th,.tblest td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}.tblest th:first-child,.tblest td:first-child{text-align:left}
.tblest th{font-size:.72rem;color:var(--muted);font-weight:600}
details.gr{border-bottom:1px solid var(--line);padding:8px 0}details.gr summary{cursor:pointer;font-weight:600}
.grupos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:560px){.grupos{grid-template-columns:repeat(6,1fr)}}
.grupos button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.grupos b{font-family:var(--display);font-size:1.1rem}
.grupos span{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{border:2px solid var(--ok)}
.result.no{border-color:var(--bad)}
.pick{display:flex;flex-direction:column;gap:10px}
.pick label,.chk{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}
.pick label:has(input:checked),.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pick input,.chk input{width:24px;min-height:24px;height:24px;flex:none;accent-color:var(--accent)}
.chk.off{cursor:default;opacity:.75}
.muted{color:var(--muted);font-size:.86rem}
.nota{font-size:.86rem;background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 12px}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.cargando{text-align:center;color:var(--muted);padding:40px 10px}
.salida{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--line)}
.salida:last-child{border-bottom:0}
.salida .h{font-variant-numeric:tabular-nums;font-weight:600}
.hecho{text-align:center;align-items:center;border:2px solid var(--ok)}
.check{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.check svg{width:44px;height:44px}
.horag{font-family:var(--display);font-size:2.3rem;font-variant-numeric:tabular-nums;line-height:1}
details summary{cursor:pointer;color:var(--accent);font-weight:500;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:10;
  padding:4px max(6px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
nav.bar div{max-width:720px;margin:0 auto;display:flex}
nav.bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:.72rem;font-weight:500;background:none;border:0;color:var(--muted);padding:8px 0 6px;cursor:pointer;min-height:56px}
nav.bar button[aria-current="page"]{color:var(--accent)}
nav.bar svg{width:24px;height:24px}
.back{display:flex;align-items:center;gap:6px;font:inherit;font-weight:500;background:none;border:0;color:var(--accent);padding:6px 0;cursor:pointer;min-height:44px;align-self:flex-start}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:.92rem;width:max-content;max-width:calc(100% - 28px);z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#cam{position:fixed;inset:0;z-index:30;background:#0b1114;color:#fff;display:flex;flex-direction:column;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#cam .camtop{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:720px;width:100%;margin:0 auto}
#cam .camtop b{font-size:1.05rem}
#cam .btn{background:#1f2c33;border-color:#2f4049;color:#fff}
#cam .btn.pri{background:#4cc0c2;border-color:#4cc0c2;color:#0b1114}
#cam input{background:#1f2c33;border-color:#2f4049;color:#fff}
#cam .cuerpo{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;max-width:720px;width:100%;margin:0 auto;overflow:auto}
#lector{width:100%;border-radius:16px;overflow:hidden;background:#000}
#lector video{width:100%!important;border-radius:16px}
.login{max-width:440px;margin:0 auto;width:100%;padding-top:3vh}
.login h1{font-size:1.45rem}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.tabs3 button{font:inherit;font-size:.85rem;font-weight:500;min-height:40px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer}
.tabs3 button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pass{position:relative}
.pass button{position:absolute;right:6px;bottom:6px;min-height:34px;padding:4px 10px;font:inherit;font-size:.8rem;border:0;border-radius:8px;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;color:var(--muted)}
#guia{position:fixed;inset:0;z-index:35;background:rgba(10,20,24,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#guia .caja{background:var(--card);border-radius:22px;max-width:460px;width:100%;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#guia .ico{width:64px;height:64px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
#guia .ico svg{width:36px;height:36px}
#guia h2{font-size:1.3rem}
#guia p{font-size:1.02rem;line-height:1.5}
.puntos{display:flex;gap:6px}.puntos i{width:8px;height:8px;border-radius:50%;background:var(--line)}.puntos i.on{background:var(--accent);width:22px;border-radius:4px}
ol.pasos{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:p}
ol.pasos li{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;counter-increment:p}
ol.pasos li::before{content:counter(p);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--card);display:grid;place-items:center;font-weight:600;font-size:.9rem}
ol.pasos b{font-weight:600}ol.pasos span{color:var(--muted);font-size:.9rem}
.ayudita{font-size:.82rem;color:var(--muted);font-weight:400}
.aviso{display:flex;gap:12px;align-items:center;background:var(--warn-soft);border-radius:14px;padding:12px 14px}
.aviso svg{width:26px;height:26px;flex:none;color:var(--warn)}
.paso{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--card);font-size:.78rem;font-weight:600;margin-right:6px;vertical-align:1px}
.rolcard{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--fg);cursor:pointer}
.rolcard svg{width:30px;height:30px;color:var(--accent);flex:none}
.rolcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rolcard b{display:block}.rolcard span{font-size:.84rem;color:var(--muted)}
.top .row{flex-wrap:nowrap;gap:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="cargando">Cargando…</div></div>
<nav class="bar" id="bar" hidden><div id="barin"></div></nav>
<div id="cam" hidden>
  <div class="camtop"><b>Apunta al código QR</b><button class="btn sm" data-a="cerrarcam">Cerrar</button></div>
  <div class="cuerpo">
    <div id="lector"></div>
    <form id="f-scan" class="row"><input id="qrin" class="grow" placeholder="O escribe el código: QR-…" autocapitalize="characters" spellcheck="false" aria-label="Código QR"><button class="btn pri" type="submit">Buscar</button></form>
  </div>
</div>
<div id="guia" hidden role="dialog" aria-modal="true" aria-labelledby="guiaTit"></div>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script>
/* ===================== CONFIGURACIÓN ===================== */
// URL de la aplicación web de Apps Script (termina en /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbxW_SUxXac2-4rzW6YwGE_CDK0a6Clm9JqKHfpRwqQZhOpyqftlCiDN186-Y6kALiMeZw/exec';
const ESCUELA = 'Escuela Primaria Profesor Gerardo Guadalupe Leal Leal';
/* ========================================================= */

const GRUPOS=['1°A','1°B','2°A','2°B','3°A','3°B','4°A','4°B','5°A','5°B','6°A','6°B'];
const PARENTESCOS=['Mamá','Papá','Abuela','Abuelo','Tía','Tío','Hermano(a) mayor de edad','Padrastro','Madrastra','Otro'];
const MOTIVOS=['Cita médica','Se sintió mal','Asunto familiar','Otro'];
const PARENTESCOS_OTRA=['Vecino(a)','Amigo(a) de la familia','Abuela','Abuelo','Tía','Tío','Primo(a) mayor de edad','Chofer o transporte particular','Otro'];

/* ---------- Íconos ---------- */
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  home:svg('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'),
  list:svg('<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>'),
  scan:svg('<path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/><path d="M7 12h10"/>'),
  people:svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14a6 6 0 013.5 6"/>'),
  more:svg('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'),
  qr:svg('<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/>'),
  clock:svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>'),
  user:svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>'),
  key:svg('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>'),
  bus:svg('<rect x="4" y="3" width="16" height="14" rx="2"/><path d="M4 11h16M8 17v3M16 17v3"/><circle cx="8" cy="14" r=".6"/><circle cx="16" cy="14" r=".6"/>'),
  wa:svg('<path d="M4 20l1.3-3.9A8 8 0 1112 20a8 8 0 01-4-1.1z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 01-1.8-1.8l.8-1-1-2z"/>'),
  check:svg('<path d="M5 12.5l4.5 4.5L19 7"/>'),
  chart:svg('<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>'),
  person:svg('<circle cx="12" cy="7.5" r="3.5"/><path d="M5 21v-1a7 7 0 0114 0v1"/>'),
  chev:'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>'
};

/* ---------- Ayuda por tipo de usuario ---------- */
const GUIAS={
  padre:{
    bienvenida:[[I.qr,'Este es el código de tu hijo(a)','En «Mis hijos» está el código QR de cada uno. La persona que lo recoja debe mostrarlo al maestro a la hora de la salida.'],

// Solo lectura: se pueden repetir sin riesgo si se corta el internet
const LECTURAS=new Set(['version','entrar','datosPadre','datosMaestro','abrirAlumno','buscarQR','resumenDir','listaGrupo','buscarAlumnos','fichaAlumno','listaMaestros','transporteDir','listaPermisos','reporte','sinAcuerdo','estadisticas']);
const esperar=ms=>new Promise(r=>setTimeout(r,ms));
// Reintenta sola cuando hay mucha gente conectada (Google responde "ocupado" o con una página de error)
async function api(fn,...args){
  if(!/^https:\/\/script\.google\.com\//.test(API_URL))throw new Error('Falta configurar API_URL en index.html.');
  const intentos=4;
  for(let i=1;;i++){
    let r,j,reintentable=false,error;
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),60000);
    try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify({fn,args}),signal:ctl.signal})}
    catch(e){error=ctl.signal.aborted?'El servidor tardó demasiado. Intenta de nuevo.':'Sin conexión. Revisa tu internet e intenta de nuevo.';reintentable=LECTURAS.has(fn)}
    finally{clearTimeout(t)}
    if(r){
      try{j=await r.json()}catch(e){j=null}
      if(j&&j.ok)return j.data;
      if(j&&!/^OCUPADO/.test(j.error||''))return respuesta(j);
      // Ocupado o error de Google antes de ejecutar: no se escribió nada, se puede repetir
      error='Hay muchas personas usando la aplicación. Intenta de nuevo en un momento.';reintentable=true;
    }
    if(!reintentable||i>=intentos)throw new Error(error);
    if(i===2)toast('Mucha gente conectada… seguimos intentando.');
    await esperar(1200*i+Math.random()*1500);
  }
}
function respuesta(j){
  if(!j.ok){
    if(/sesión terminó/.test(j.error))cerrarSesion(true);
    if(j.error==='Acción no válida.')throw new Error('Falta actualizar el servidor en Google Drive (pasos en el README de GitHub).');
    throw new Error(j.error);
  }
  return j.data;
}
async function hacer(btn,fn){
  const txt=btn&&btn.innerHTML;if(btn){btn.disabled=true;btn.innerHTML='Un momento…'}
  try{return await fn()}catch(e){toast(e.message||String(e))}
  finally{if(btn&&document.body.contains(btn)){btn.disabled=false;btn.innerHTML=txt}}
}
function leerFoto(file){return new Promise((ok,mal)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',0.82))};img.onerror=()=>mal(new Error('No se pudo leer la foto.'));img.src=r.result};r.onerror=()=>mal(new Error('No se pudo leer la foto.'));r.readAsDataURL(file)})}

    ${s.hoy?`<p class="pill ${s.hoy.tipo==='No autorizado'?'bad':'ok'}" style="align-self:flex-start;white-space:normal">Hoy salió ${esc(s.hoy.hora)} · ${textoSalida(s.hoy)}</p>`:s.asistencia==='Faltó'?'<p class="pill bad" style="align-self:flex-start;white-space:normal">Hoy está registrado(a) como ausente. Si sí vino, avisa a la escuela.</p>':''}
    <div class="qrwrap"><div class="qr" data-code="${esc(s.qr)}"></div><span class="code muted">${esc(s.qr)}</span>
    <p class="muted">Toma captura, imprímelo o pégalo en la credencial. Cualquier persona autorizada puede mostrarlo.</p></div>
    ${botonConfirmar('qr'+s.id,'Cambiar código QR','nuevoqr',`data-id="${s.id}"`,'El código actual dejará de funcionar y tendrás que usar el nuevo.')}</section>`).join('');
},
padre_personas(){

  ${confirmar==='p'+p.id?`<button class="btn warn sm" data-a="quitarp" data-id="${p.id}">Confirmar</button>`:`<button class="btn sm" data-a="pedir" data-k="p${p.id}">Quitar</button>`}</div>`).join('')||'<p class="muted">Todavía no hay personas. Agrega al menos una.</p>'}</div></section>

},
padre_historial(){const d=D.padre;if(!d)return cargando;return `<section class="card">${listaSalidas(d.historial,'Todavía no hay salidas registradas.')}</section>`},
padre_cuenta(){

/* ===== MAESTRO ===== */
maestro_salidas(){
  const d=D.maestro;if(!d)return `<button class="btn pri xl full" data-a="camara">${I.scan} Escanear código QR</button>`+cargando;
  const g=d.grupo,fuera=g.filter(a=>a.salida),faltas=g.filter(a=>!a.salida&&a.asistencia==='Faltó'),dentro=g.filter(a=>!a.salida&&a.asistencia!=='Faltó'),trans=g.filter(a=>a.transporte),transPend=trans.filter(a=>!a.salida);
  const lista=filtro==='dentro'?dentro:filtro==='fuera'?fuera:g;
  let h=`<button class="btn pri xl full" data-a="camara">${I.scan} Escanear código QR</button>
  <p class="muted" style="text-align:center"><span class="paso">1</span>Escanea <span class="paso">2</span>Toca la foto <span class="paso">3</span>Registrar salida</p>
  <div class="stats" ${trans.length?'':'style="grid-template-columns:repeat(2,1fr)"'}><div class="stat"><b>${dentro.length}</b><span>En la escuela</span></div><div class="stat"><b>${fuera.length}</b><span>Ya salieron</span></div>${trans.length?`<div class="stat"><b>${trans.length-transPend.length}/${trans.length}</b><span>Transporte</span></div>`:''}</div>`;
  if(!d.listaPasada&&d.temprana)h+=`<div class="aviso">${I.list}<div class="grow"><b>Pasa lista antes de la salida</b><p class="muted">Marca quién faltó y quién se va en transporte hoy.</p></div><button class="btn sm pri" data-tab="asistencia">Lista</button></div>`;
  if(faltas.length)h+=`<p class="muted">Faltaron hoy: <b>${esc(faltas.map(a=>nom1(a.nombre)).join(', '))}</b> · no aparecen para entregar.</p>`;
  if(d.temprana)h+=`<p class="nota">Antes de las <b>${esc(d.horaSalida)}</b> la salida cuenta como <b>temprana</b> y se pide el motivo.</p>`;
  if(transPend.length){
    const rutas={};transPend.forEach(a=>(rutas[a.transporte]=rutas[a.transporte]||[]).push(nom1(a.nombre)));
    h+=`<section class="card"><div class="row"><h2 class="grow">Transporte</h2><span class="pill">${I.bus}${transPend.length} por entregar</span></div>
    <p class="muted">${Object.keys(rutas).sort().map(r=>`<b>${esc(r)}:</b> ${esc(rutas[r].join(', '))}`).join(' · ')}</p>
    ${botonConfirmar('trans',`${I.bus} Entregar ${transPend.length} al transporte`,'transporte',`data-ids="${transPend.map(a=>a.id).join(',')}"`,'Se registrará que subieron al transporte y se avisará a sus familias.','btn pri full')}</section>`;
  }
  h+=`<div class="chips" role="group" aria-label="Filtrar">${[['todos','Todos',g.length],['dentro','En la escuela',dentro.length],['fuera','Salieron',fuera.length]].map(([k,l,n])=>`<button aria-pressed="${filtro===k}" data-a="filtro" data-val="${k}">${l} · ${n}</button>`).join('')}</div>
  <section class="card"><div class="row"><h2 class="grow">${esc(d.yo.grupo)}</h2><span class="muted">Toca a un alumno para darle salida</span></div>
  <div class="list">${lista.map(a=>filaAlumno(a)).join('')||'<p class="muted">No hay alumnos aquí.</p>'}</div></section>`;
  if(d.extras.length)h+=`<section class="card"><h3>Hermanos que también entregas</h3><div class="list">${d.extras.map(a=>filaAlumno(a,true)).join('')}</div></section>`;
  return h;
},
maestro_asistencia(){
  const d=D.maestro;if(!d)return cargando;
  const g=d.grupo,faltas=g.filter(a=>a.asistencia==='Faltó'),trans=g.filter(a=>a.transporte);
  const fecha=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  const fila=a=>{
    if(a.salida)return `<div class="asis"><div class="row"><span class="grow"><b>${esc(a.nombre)}</b><span class="s">${textoSalida(a.salida)}</span></span><span class="pill ok">Salió ${esc(a.salida.hora)}</span></div></div>`;
    const ops=a.ruta?[['','Presente',''],['Faltó','Faltó','falta'],['Recogen','Lo recogen','trans']]:[['','Presente',''],['Faltó','Faltó','falta'],['Transporte','Transporte','trans']];
    const sub=a.asistencia==='Faltó'?'Faltó · su familia recibe un correo'+(waLink(a.telefono,'x')?` · <a class="mini" href="${waLink(a.telefono,`${ESCUELA}: hoy ${a.nombre} (${a.grupo}) no se presentó a clases. Si salió de casa hacia la escuela, comuníquese de inmediato con nosotros.`)}" target="_blank" rel="noopener">${I.wa}WhatsApp</a>`:''):a.transporte?`Se va en ${esc(a.transporte)}`:a.ruta?`Hoy lo recogen (normalmente ${esc(a.ruta)})`:'Lo recogen';
    let h=`<div class="asis"><span><b>${esc(a.nombre)}</b><span class="s">${sub}</span></span>
    <div class="seg tres" role="group" aria-label="Asistencia de ${esc(nom1(a.nombre))}">${ops.map(([k,l,c])=>`<button class="${c}" aria-pressed="${(a.asistencia||'')===k}" data-a="asis" data-id="${a.id}" data-val="${k}">${l}</button>`).join('')}</div>`;
    if(confirmar==='ruta'+a.id)h+=`<div class="row"><select id="ruta${a.id}" class="grow" aria-label="Ruta">${(d.rutas.length?d.rutas:['Transporte']).map(r=>`<option>${esc(r)}</option>`).join('')}</select><button class="btn pri sm" data-a="asisruta" data-id="${a.id}">Guardar</button><button class="btn sm" data-a="cancelar">Cancelar</button></div>`;
    return h+'</div>';
  };
  return `<p class="muted" style="text-transform:capitalize;margin:0">${esc(fecha)} · ${esc(d.yo.grupo)}</p>
  <div class="stats"><div class="stat"><b>${g.length-faltas.length}</b><span>Presentes</span></div><div class="stat"><b>${faltas.length}</b><span>Faltaron</span></div><div class="stat"><b>${trans.length}</b><span>Transporte hoy</span></div></div>
  <p class="nota">Todos empiezan como <b>presentes</b>. Marca solo a quien <b>faltó</b> y los cambios de transporte de hoy. Quien faltó no aparece para entregar y su familia recibe un correo.</p>
  <section class="card"><div>${g.map(fila).join('')||'<p class="muted">No hay alumnos en tu grupo.</p>'}</div></section>`;
},
maestro_permisos(){
  const d=D.maestro;if(!d)return cargando;
  const descr=p=>p.alumno?esc(p.alumno):'Todo el grupo '+esc(p.grupo);
  return `<section class="card"><h2>Hermanos en otros grupos</h2>
  <p class="muted">Si siempre salen juntos, deja que el maestro del hermano los entregue. Es permanente hasta que lo quites.</p>
  <div class="list">${d.hermanos.map(h=>`<div class="item"><div class="grow"><b>${esc(h.alumno.nombre)}</b><span class="s">Su hermano(a) ${esc(nom1(h.hermano.nombre))} está en ${esc(h.hermano.grupo)} · ${esc(h.maestro.nombre)}${h.maestro.tipo==='Jornada ampliada'?' (jornada ampliada)':''}</span></div>
    ${h.clave?(confirmar==='q'+h.clave?`<button class="btn warn sm" data-a="quitarpermiso" data-id="${esc(h.clave)}">Quitar</button>`:`<button class="btn sm" data-a="pedir" data-k="q${esc(h.clave)}"><span class="pill ok">Permanente</span></button>`)
      :`<button class="btn pri sm" data-a="permitirhermano" data-m="${h.maestro.id}" data-id="${h.alumno.id}">Permitir a ${esc(nom1(h.maestro.nombre))}</button>`}</div>`).join('')||'<p class="muted">Ningún alumno de tu grupo tiene hermanos en otros grupos.</p>'}</div>
  ${d.hermanos.some(h=>h.clave)?'<p class="muted">Toca <b>Permanente</b> para quitar el permiso.</p>':''}</section>
  <form class="card form" id="f-permiso"><h2>Dar permiso a otro maestro</h2>
  <label class="f" for="gt">Maestro<select id="gt">${d.maestros.map(t=>`<option value="${t.id}">${esc(t.nombre)} · ${esc(t.grupo)}</option>`).join('')}</select></label>
  <label class="f" for="ga">¿A quién puede entregar?<select id="ga"><option value="">Todo mi grupo (${esc(d.yo.grupo)})</option>${d.alumnosGrupo.map(a=>`<option value="${a.id}">${esc(a.nombre)}</option>`).join('')}</select></label>

  <section class="card"><h3>Permisos que tienes</h3>${d.recibidos.length?`<div class="list">${d.recibidos.map(p=>filaPermiso(p,descr(p),'De '+esc(p.titular))).join('')}</div>`:'<p class="muted">Ninguno.</p>'}</section>`;
},

},

function vSinRecoger(l){
  if(!l)return '';
  if(!l.length)return `<section class="card" style="border-color:var(--ok)"><p><b>Todos los alumnos ya salieron.</b></p></section>`;
  const g={};l.forEach(a=>(g[a.grupo]=g[a.grupo]||[]).push(a));
  return `<section class="card" style="border-color:var(--bad)"><div class="row"><h2 class="grow">Siguen en la escuela</h2><span class="pill bad">${l.length}</span></div>
  <p class="muted">Ya pasó la hora de salida y no tienen salida registrada (los que faltaron no cuentan).</p>
  ${Object.keys(g).map(k=>`<details class="gr" ${l.length<=8?'open':''}><summary>${esc(k)} · ${g[k].length}</summary><div class="list">${g[k].map(a=>`<div class="item"><span class="grow"><b>${esc(a.nombre)}</b><span class="s">${a.transporte?I.bus.replace('<svg','<svg width="14" height="14" style="vertical-align:-2px"')+' '+esc(a.transporte)+' · ':''}${esc(a.tutor||'Sin tutor')}${a.telefono?` · <a href="tel:${esc(a.telefono)}">${esc(a.telefono)}</a>`:''}</span>
    ${waLink(a.telefono,'x')?`<a class="mini" href="${waLink(a.telefono,`${ESCUELA}: ${a.nombre} (${a.grupo}) sigue en la escuela. Por favor pase a recogerlo(a) o avísenos quién vendrá.`)}" target="_blank" rel="noopener">${I.wa}WhatsApp</a>`:''}</span></div>`).join('')}</div></details>`).join('')}</section>`;
}
function segDuracion(){
  return `<div><h3 style="margin-bottom:6px">¿Por cuánto tiempo?</h3><div class="seg" role="group">${[['hoy','Solo hoy'],['siempre','Siempre']].map(([k,l])=>`<button type="button" aria-pressed="${permDur===k}" data-a="dur" data-val="${k}">${l}</button>`).join('')}</div>
  <p class="muted" style="margin-top:6px">${permDur==='siempre'?'Queda activo hasta que alguien lo quite.':'Se quita solo al terminar el día.'}</p></div>`;
}
function filaPermiso(p,titulo,detalle){
  return `<div class="item"><div class="grow"><b>${titulo}</b><span class="s">${detalle} · <span class="pill ${p.duracion==='siempre'?'ok':'gris'}">${p.duracion==='siempre'?'Permanente':'Solo hoy'}</span></span></div>
  ${confirmar==='q'+p.clave?`<button class="btn warn sm" data-a="quitarpermiso" data-id="${esc(p.clave)}">Confirmar</button>`:`<button class="btn sm" data-a="pedir" data-k="q${esc(p.clave)}">Quitar</button>`}</div>`;
}
function listaAlumnos(l){
  if(!l)return cargando;
  if(!l.length)return '<p class="muted">No hay alumnos aquí. Dalos de alta o impórtalos desde Excel.</p>';
  return `<div class="list">${l.map(a=>`<button class="item" data-a="ficha" data-id="${a.id}"><span class="grow"><b>${esc(a.nombre)}</b><span class="s">${a.grupo?esc(a.grupo)+' · ':''}${a.tutor!==undefined?'Tutor: '+esc(a.tutor)+' · PIN '+esc(a.pin):(a.activo===false?'Dado de baja':'')}</span></span>${a.acuerdo===false?'<span class="pill gris">Sin acuerdo</span>':''}${a.transporte?`<span class="pill">${I.bus}${esc(a.transporte)}</span>`:''}${I.chev}</button>`).join('')}</div>`;

function formPersona(famId){

function abrirEntrega(o){
  E={o,res:null,persona:'',transporte:false,hermanos:{},motivo:'',hecho:null,via:o.qr?'QR':'Lista',otra:false,od:null};
  if(sub()&&sub().t==='entrega'){render();cargarSub()}else abrir({t:'entrega'});
}
function iniciarEntrega(r){
  E.res=r;if(!r.valido)return;
  E.transporte=!!r.alumno.transporte&&!r.salida;
  E.persona=r.personas.length===1?r.personas[0].id:'';E.otra=false;E.od=null;
  E.hermanos={};
  r.hermanos.forEach(h=>{if(h.permiso!=='no'&&!h.salida)E.hermanos[h.id]=['siempre','propio','dir'].indexOf(h.permiso)>=0});
}
const etiquetaPermiso={propio:'Tu grupo',hoy:'Permiso de hoy',siempre:'Permiso permanente',dir:'Dirección',no:'Sin permiso'};
function hermanosElegibles(){return E.res.hermanos.filter(h=>h.permiso!=='no'&&!h.salida&&h.asistencia!=='Faltó'&&(!E.transporte||h.transporte))}
// Persona NO autorizada: datos, identificación, confirmación y foto obligatoria

  <label class="f" for="onn">Nombre completo de quien recoge<input id="onn" value="${esc(o.nombre||'')}" autocomplete="off"></label>

  <label class="f" for="oni">Identificación que presentó${sel('oni',r.identificaciones||[],o.identificacion,'Elige…')}</label>
  <label class="f" for="onc">¿Cómo se confirmó?${sel('onc',r.confirmaciones||[],o.confirmo,'Elige…')}</label>

function guardarOtra(){if(!E||!E.otra||!$('onn'))return;E.od=Object.assign(E.od||{},{nombre:val('onn'),parentesco:val('onp'),telefono:val('ont'),identificacion:val('oni'),confirmo:val('onc')})}
function botonRegistrar(){

entrega(){
  if(!E||!E.res)return cargando;
  const r=E.res;
  if(!r.valido)return `<section class="card result no"><h2>Código no válido</h2><p class="muted">Puede ser un código QR que la familia ya cambió. Pide identificación y avisa a la dirección.</p></section><button class="btn pri big full" data-a="siguiente">${I.scan} Escanear otro</button>`;
  if(E.hecho)return vHecho();
  const a=r.alumno,ok=r.permiso!=='no';
  let h=`<section class="card result ${ok?'':'no'}"><div class="row">${av(a.nombre,a.foto,'lg')}<div class="grow"><h1>${esc(a.nombre)}</h1><span class="muted">${esc(a.grupo)} · ${esc(a.titular)}</span></div></div>

    return h;
  }
  if(!ok)return h+`<section class="card"><p>${esc(nom1(a.nombre))} es de ${esc(a.grupo)}. Para entregarlo, ${esc(a.titular)} debe darte permiso en su sección <b>Permisos</b> (solo hoy o siempre).</p></section>`;

  if(!E.transporte&&!E.otra){
    h+=r.personas.length?`<section class="card"><h2><span class="paso">1</span>Toca la foto de quien lo recoge</h2><div class="pick">${r.personas.map((p,i)=>`<label for="pk${i}"><input type="radio" name="pk" id="pk${i}" value="${p.id}" ${E.persona===p.id?'checked':''}>${av(p.nombre,p.foto,'xl')}<span class="grow"><b>${esc(p.nombre)}</b><br><span class="muted">${esc(p.parentesco)}</span></span></label>`).join('')}</div></section>`
      :`<section class="card result no"><p>Esta familia no tiene personas autorizadas registradas.</p></section>`;
    h+=`<button class="btn full" data-a="otra">${I.person} Lo recoge otra persona (no está en las fotos)</button>`;
  }
  if(!E.transporte&&E.otra)h+=formOtra(r);
  if(r.hermanos.length){
    h+=`<section class="card"><h3>Hermanos · márcalos si salen juntos</h3><div class="pick">${r.hermanos.map(x=>{
      if(x.salida)return `<div class="chk off"><span class="grow"><b>${esc(x.nombre)}</b> · ${esc(x.grupo)}<br><span class="muted">Ya salió ${esc(x.salida.hora)}</span></span></div>`;
      if(x.asistencia==='Faltó')return `<div class="chk off"><span class="grow"><b>${esc(x.nombre)}</b> · ${esc(x.grupo)}<br><span class="muted">Faltó hoy</span></span></div>`;
      if(x.permiso==='no')return `<div class="chk off"><span class="grow"><b>${esc(x.nombre)}</b> · ${esc(x.grupo)}<br><span class="muted">Para entregarlo necesitas permiso de ${esc(x.titular)}</span></span></div>`;
      if(E.transporte&&!x.transporte)return `<div class="chk off"><span class="grow"><b>${esc(x.nombre)}</b> · ${esc(x.grupo)}<br><span class="muted">No usa transporte</span></span></div>`;
      return `<label class="chk" for="hm${x.id}"><input type="checkbox" id="hm${x.id}" data-h="${x.id}" ${E.hermanos[x.id]?'checked':''}><span class="grow"><b>También sale ${esc(x.nombre)}</b><br><span class="muted">${esc(x.grupo)} · ${etiquetaPermiso[x.permiso]}</span></span></label>`;
    }).join('')}</div></section>`;
  }
  if(r.temprana&&!E.transporte){
    h+=`<section class="card" style="border-color:var(--mark)"><h2><span class="paso">2</span>Salida temprana: elige el motivo</h2><p class="muted">Es antes de las ${esc(r.horaSalida)}.</p>
    <div class="chips envolver">${MOTIVOS.map(m=>`<button aria-pressed="${E.motivo===m}" data-a="motivo" data-val="${esc(m)}">${esc(m)}</button>`).join('')}</div>
    ${E.motivo==='Otro'?`<label class="f" for="motivoOtro">¿Cuál?<input id="motivoOtro" autocomplete="off"></label>`:''}</section>`;
  }
  return h+`<button class="btn ${E.otra?'warn':'pri'} big full" data-a="registrar" data-id="${a.id}" id="btnreg" ${!E.transporte&&!E.otra&&!r.personas.length?'disabled':''}>${botonRegistrar()}</button>`;

async function abrirCamara(){

      async texto=>{if(leido)return;leido=true;if(navigator.vibrate)navigator.vibrate(80);await cerrarCamara(true);buscar(texto)},()=>{});

}

/* ---------- Excel ---------- */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
function transporteTexto(r){const t=String(r.transporte||'').trim();if(/^no$/i.test(t)||(!t&&!r.ruta))return'No';if(/^s[ií]$/i.test(t))return r.ruta||'Sí';return t||r.ruta}
const esCurp=c=>/^[A-Z0-9]{18}$/.test(c);
function leerExcel(file){
  const esCsv=/\.csv$/i.test(file.name||'');
  return new Promise((ok,mal)=>{const r=new FileReader();r.onload=()=>{try{
    const wb=esCsv?XLSX.read(String(r.result).replace(/^\uFEFF/,''),{type:'string'}):XLSX.read(new Uint8Array(r.result),{type:'array'});
    const hoja=wb.SheetNames.find(n=>norm(n)==='alumnos')||wb.SheetNames[0];
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[hoja],{header:1,defval:'',raw:false,blankrows:false});
    const hi=aoa.findIndex(f=>f.some(c=>norm(c).includes('curp')));
    if(hi<0)return mal(new Error('No encontré los encabezados. Usa la plantilla de la escuela (debe tener la columna CURP).'));
    const enc=aoa[hi].map(norm),col=t=>enc.findIndex(t);
    const cN=col(k=>k.includes('nombre')&&!k.includes('tutor')&&!k.includes('padre')&&!k.includes('madre')&&!k.includes('herman'));
    const cC=col(k=>k.includes('curp')&&!k.includes('herman'));
    const cG=col(k=>k.includes('grupo')),cGr=col(k=>k.includes('grado')&&!k.includes('grupo'));
    const cTr=col(k=>k.includes('transporte')&&!k.includes('ruta')),cRu=col(k=>k.includes('ruta'));
    const cH=col(k=>k.includes('herman'));
    const cT=col(k=>(k.includes('tutor')||k.includes('padre')||k.includes('madre'))&&!k.includes('correo')&&!k.includes('mail')&&!k.includes('tel'));
    const cTel=col(k=>k.includes('tel')||k.includes('cel')||k.includes('whats'));
    const cE=col(k=>k.includes('correo')||k.includes('mail'));
    const faltan=[cN<0&&'Nombre del alumno',cC<0&&'CURP',(cG<0&&cGr<0)&&'Grado y grupo'].filter(Boolean).join(', ');
    const v=(f,c)=>c<0?'':String(f[c]==null?'':f[c]).trim();
    const filas=aoa.slice(hi+1).map(f=>{
      let g=v(f,cG);const gr=v(f,cGr);if(gr&&(!g||/^[AB]$/i.test(g)))g=gr+g;
      const curp=v(f,cC).toUpperCase().replace(/\s/g,'');
      const hermanos=v(f,cH).toUpperCase();
      const nH=hermanos.split(/[^A-Z0-9]+/).filter(x=>x.length===18&&x!==curp).length;
      const gm=g.toUpperCase().replace(/\s/g,'').match(/^([1-6])\D*([AB])$/);
      const nombre=v(f,cN);
      const aviso=!nombre?'Falta el nombre':!esCurp(curp)?'CURP debe tener 18 caracteres':!gm?'Revisa grado y grupo':'';
      return{nombre,curp,grupo:gm?gm[1]+'°'+gm[2]:g,transporte:v(f,cTr),ruta:v(f,cRu),hermanos,nHermanos:nH,tutor:v(f,cT),telefono:v(f,cTel),correo:v(f,cE),aviso};
    }).filter(x=>x.nombre||x.curp);
    if(!filas.length)return mal(new Error('El archivo no tiene alumnos. Llena la hoja «Alumnos» a partir de la fila 2.'));
    const bloques=bloquesPorFamilia(filas);
    ok({filas,faltan,bloques,familias:bloques.familias,conHermanos:bloques.conHermanos,enTransporte:filas.filter(x=>transporteTexto(x)!=='No').length});
  }catch(e){mal(new Error('No pude leer el archivo. Guárdalo como .xlsx e intenta de nuevo.'))}};r.onerror=()=>mal(new Error('No pude leer el archivo.'));if(esCsv)r.readAsText(file,'utf-8');else r.readAsArrayBuffer(file)});
}
// Agrupa a los hermanos para enviarlos juntos al servidor (lotes de hasta 60 alumnos)
function bloquesPorFamilia(filas){
  const padre={},raiz=x=>{while(padre[x]!==x)x=padre[x];return x};
  const unir=(a,b)=>{[a,b].forEach(x=>{if(!padre[x])padre[x]=x});const ra=raiz(a),rb=raiz(b);if(ra!==rb)padre[rb]=ra};
  const keys=filas.map((f,i)=>{const k=f.curp||('#'+i);if(!padre[k])padre[k]=k;f.hermanos.split(/[^A-Z0-9]+/).filter(x=>x.length===18&&x!==f.curp).forEach(h=>unir(k,h));return k});
  const grupos={};keys.forEach((k,i)=>(grupos[raiz(k)]=grupos[raiz(k)]||[]).push(i));
  const lotes=[];let lote=[];
  Object.values(grupos).forEach(g=>{if(lote.length&&lote.length+g.length>60){lotes.push(lote);lote=[]}lote=lote.concat(g)});
  if(lote.length)lotes.push(lote);
  lotes.familias=Object.keys(grupos).length;
  lotes.conHermanos=Object.values(grupos).filter(g=>g.length>1).reduce((n,g)=>n+g.length,0);
  return lotes;
}

    case 'camara':return abrirCamara();
    case 'cerrarcam':{await cerrarCamara();if(history.state&&history.state.cam)history.back();return}
    case 'siguiente':return atras(abrirCamara);
    case 'filtro':filtro=b.dataset.val;return render();
    case 'hoyfiltro':hoyFiltro=b.dataset.val;return render();
    case 'dur':permDur=b.dataset.val;return render();
    case 'otra':guardarOtra();E.otra=!E.otra;if(E.otra)E.persona='';render();if(E.otra&&$('onn'))$('onn').focus();return;
    case 'modo':E.transporte=b.dataset.val==='transporte';E.hermanos={};E.res.hermanos.forEach(h=>{if(h.permiso!=='no'&&!h.salida)E.hermanos[h.id]=E.transporte?!!h.transporte:['siempre','propio','dir'].indexOf(h.permiso)>=0});return render();
    case 'motivo':E.motivo=b.dataset.val;render();if(E.motivo==='Otro'&&$('motivoOtro'))$('motivoOtro').focus();return;
    case 'entrega':return abrirEntrega({id});
    case 'ficha':D.ficha=null;return abrir({t:'ficha',id});
    case 'alta':return abrir({t:'alta'});
    case 'importar':D.imp=null;return abrir({t:'importar'});
    case 'reportes':return abrir({t:'reportes'});
    case 'acuerdos':D.acu=null;return abrir({t:'acuerdos'});
    case 'estadisticas':D.est=null;return abrir({t:'estadisticas'});
    case 'clave':return abrir({t:'clave'});
    case 'ciclo':return abrir({t:'ciclo'});
    case 'horario':return abrir({t:'horario'});
    case 'transporteDir':D.trans=null;return abrir({t:'transporte'});
    case 'permisosDir':D.perm=null;return abrir({t:'permisosDir'});
    case 'nuevomaestro':return abrir({t:'maestro'});
    case 'vermaestro':return abrir({t:'maestro',id});
    case 'vergrupo':grupoSel=b.dataset.g;guardar('grupoSel',grupoSel);D.lista=null;D.busqueda='';return ir('alumnos');
    case 'pickh':$('ah').value=b.dataset.curp;$('ahsel').innerHTML=`<div class="item"><div class="grow"><b>${esc(b.dataset.n)}</b><span class="s">Mismo PIN y cuenta que su hermano</span></div><button class="btn sm" type="button" data-a="unpickh">Quitar</button></div>`;$('ahres').innerHTML='';$('ahq').value='';$('famnueva').hidden=true;return;
    case 'unpickh':$('ah').value='';$('ahsel').innerHTML='';$('famnueva').hidden=false;return;
  }
  await hacer(b,async()=>{
    switch(a){
      case 'nuevoqr':await api('cambiarQR',tok(),id);confirmar=null;toast('Código QR cambiado. El anterior ya no funciona.');await recargarTodo();break;
      case 'asis':{
        const v=b.dataset.val,al=D.maestro.grupo.find(x=>x.id===id);if(!al||(al.asistencia||'')===v)return;
        if(v==='Transporte'){confirmar='ruta'+id;render();return}
        const antes={asistencia:al.asistencia,transporte:al.transporte};
        al.asistencia=v;al.transporte=v==='Faltó'||v==='Recogen'?'':al.ruta;confirmar=null;render();
        try{await api('marcarAsistencia',tok(),[id],v);D.maestro.listaPasada=true;toast(v==='Faltó'?nom1(al.nombre)+': falta registrada. Se avisó a su familia.':v==='Recogen'?nom1(al.nombre)+': hoy lo recogen.':nom1(al.nombre)+': presente.')}
        catch(err){Object.assign(al,antes);render();throw err}
        break}
      case 'asisruta':{const ruta=val('ruta'+id),al=D.maestro.grupo.find(x=>x.id===id);await api('marcarAsistencia',tok(),[id],'Transporte',ruta);
        al.asistencia='Transporte';al.transporte=al.ruta||ruta;confirmar=null;D.maestro.listaPasada=true;toast(nom1(al.nombre)+' se va hoy en '+al.transporte+'.');render();break}
      case 'quitarfalta':await api('marcarAsistencia',tok(),[id],'');toast('Falta quitada. Ya puedes darle salida.');E.res=null;render();await cargarSub();if(D.maestro)cargar();break;
      case 'acuok':{await api('editarFamilia',tok(),{id,acuerdo:true,estadistica:b.dataset.val});D.acu=D.acu.filter(x=>x.id!==id);if(D.resumen)D.resumen.sinAcuerdo=Math.max(0,D.resumen.sinAcuerdo-1);toast('Acuerdo registrado.');render();break}
      case 'quitarp':await api('quitarPersona',tok(),id);confirmar=null;toast('Persona quitada.');await recargarTodo();break;
      case 'quitarpermiso':await api('quitarPermiso',tok(),id);confirmar=null;toast('Permiso quitado.');await recargarTodo();break;
      case 'permitirhermano':await api('darPermiso',tok(),{maestroId:b.dataset.m,alumnoId:id,duracion:'siempre'});toast('Listo: puede entregarlo siempre. Lo puedes quitar cuando quieras.');await cargar();break;
      case 'vincular':{const r=await api('vincularHermano',tok(),sub().id,id);toast(`Unidos como hermanos. La familia usa el PIN ${r.pin}.`);await cargarSub();break}
      case 'separar':{const r=await api('separarFamilia',tok(),id);confirmar=null;toast('Separado. Su nuevo PIN es '+r.pin+'.');await cargarSub();break}
      case 'pinnuevo':{const p=await api('restablecerPin',tok(),id);toast('PIN nuevo: '+p);await cargarSub();break}
      case 'baja':await api('editarAlumno',tok(),{id,activo:b.dataset.val==='1'});confirmar=null;toast(b.dataset.val==='1'?'Alumno reactivado.':'Alumno dado de baja.');await cargarSub();break;
      case 'delmaestro':await api('guardarMaestro',tok(),{id,eliminar:true});toast('Maestro eliminado.');D.maestros=null;atras();break;
      case 'transporte':{const ids=b.dataset.ids.split(',');const r=await api('entregarTransporte',tok(),ids);confirmar=null;toast(`${r.n} ${r.n===1?'alumno entregado':'alumnos entregados'} al transporte a las ${r.hora}.`);await recargarTodo();break}
      case 'deshacer':{await api('deshacerSalida',tok(),b.dataset.ids.split(','));confirmar=null;toast('Salida anulada. El alumno sigue en la escuela.');const o=E.res&&E.res.alumno?{id:E.res.alumno.id}:E.o;E=Object.assign(E,{o,res:null,hecho:null});render();await cargarSub();break}
      case 'registrar':{
        const r=E.res;const herm=hermanosElegibles().filter(h=>E.hermanos[h.id]).map(h=>h.id);
        let motivo='';
        if(r.temprana&&!E.transporte){if(!E.motivo){toast('Elige el motivo de la salida temprana.');return}motivo=E.motivo==='Otro'?'Otro: '+(val('motivoOtro')||'sin detalle'):E.motivo}
        let otra=null;
        if(!E.transporte&&E.otra){guardarOtra();otra=E.od||{};
          if(!otra.nombre||!otra.parentesco||!otra.telefono||!otra.identificacion||!otra.confirmo){toast('Llena todos los datos de quien recoge.');return}
          if(!otra.foto){toast('Toma la foto de la persona que recoge.');return}}
        else if(!E.transporte&&!E.persona){toast('Toca la foto de quien recoge al alumno.');return}
        const res=await api('registrarSalida',tok(),id,otra?'':E.persona,{hermanos:herm,transporte:E.transporte,motivo,via:E.via,otra});
        E.hecho=res;confirmar=null;render();window.scrollTo(0,0);break}
      case 'excel':{const r=await api('exportarExcel',tok(),filtroRep());const bin=atob(r.base64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);descargar(new Blob([u8],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),r.nombre);break}
      case 'subirimp':{const p=D.imp;p.res=new Array(p.filas.length);render();
        for(const lote of p.bloques){const r=await api('importarFilas',tok(),lote.map(i=>p.filas[i]));r.forEach((x,j)=>p.res[lote[j]]=x);render()}
        toast('Importación terminada.');break}
    }
  });
});

let tBusca;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='busca'){clearTimeout(tBusca);const q=t.value.trim();tBusca=setTimeout(async()=>{
    D.busqueda=q;document.querySelector('.chips').hidden=!!q;
    const box=$('listaAl');if(!q){box.innerHTML=listaAlumnos(D.lista);if(!D.lista)cargar();return}
    if(q.length<2)return;box.innerHTML=cargando;
    try{const r=await api('buscarAlumnos',tok(),q);if(D.busqueda===q)box.innerHTML=listaAlumnos(r)}catch(err){toast(err.message)}},350)}
  if(t.id==='vhq'){clearTimeout(tBusca);const q=t.value.trim();tBusca=setTimeout(async()=>{
    const box=$('vhres');if(q.length<2){box.innerHTML='';return}
    try{const r=await api('buscarAlumnos',tok(),q);const yo=sub().id;box.innerHTML=r.filter(x=>x.activo&&x.id!==yo).map(x=>`<button class="item" type="button" data-a="vincular" data-id="${x.id}"><span class="grow"><b>${esc(x.nombre)}</b><span class="s">${esc(x.grupo)} · Toca para unirlos como hermanos</span></span></button>`).join('')||'<p class="muted">Sin resultados.</p>'}catch(err){toast(err.message)}},350)}
  if(t.id==='ahq'){clearTimeout(tBusca);const q=t.value.trim();tBusca=setTimeout(async()=>{
    const box=$('ahres');if(q.length<2){box.innerHTML='';return}
    try{const r=await api('buscarAlumnos',tok(),q);box.innerHTML=r.filter(x=>x.activo).map(x=>`<button class="item" type="button" data-a="pickh" data-curp="${esc(x.curp)}" data-n="${esc(x.nombre)}"><span class="grow"><b>${esc(x.nombre)}</b><span class="s">${esc(x.grupo)}</span></span></button>`).join('')||'<p class="muted">Sin resultados.</p>'}catch(err){toast(err.message)}},350)}
});

document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.name==='pk'&&E){E.persona=t.value;return}
  if(t.id==='pf'){const f=t.files[0],im=$('pfprev');if(f&&im){im.src=URL.createObjectURL(f);im.hidden=false;$('pfb').firstChild&&($('pfb').childNodes[1].textContent=' Cambiar foto')}return}
  if(t.id==='onf'&&t.files[0]&&E){await hacer(null,async()=>{guardarOtra();E.od=E.od||{};E.od.foto=await leerFoto(t.files[0]);render()});return}
  if(t.dataset.h&&E){E.hermanos[t.dataset.h]=t.checked;const b=$('btnreg');if(b)b.innerHTML=botonRegistrar();return}
  if(t.id==='fa'&&t.files[0]){await hacer(null,async()=>{toast('Subiendo foto…');await api('fotoAlumno',tok(),sub().id,await leerFoto(t.files[0]));toast('Foto actualizada.');await cargarSub()})}
  if(t.id==='xls'&&t.files[0]){await hacer(null,async()=>{D.imp=await leerExcel(t.files[0]);render()})}
});

document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,btn=f.querySelector('button[type=submit]');
  if(btn&&btn.disabled)return;  // evita doble envío
  if(f.id==='f-scan'){const v=val('qrin');await cerrarCamara(true);buscar(v);return}
  if(f.id==='f-scan2'){buscar(val('qrin2'));return}
  await hacer(btn,async()=>{
    switch(f.id){
      case 'f-login':{const r=await api('entrar',rolLogin,val('lu'),val('lp'));guardar('usuario_'+rolLogin,val('lu'));ses=r;guardar('sesion',r);tab='';pila=[];D={};render();mostrarGuia();await cargar();break}
      case 'f-persona':{const file=$('pf').files[0];if(!file){toast('Agrega la foto del rostro.');return}
        await api('agregarPersona',tok(),{nombre:val('pn'),parentesco:val('pr'),foto:await leerFoto(file),famId:f.dataset.fam||''});toast('Persona agregada.');await recargarTodo();break}
      case 'f-contacto':await api('cambiarContacto',tok(),{correo:val('cc'),telefono:val('ct')});toast('Datos guardados.');await cargar();break;
      case 'f-pin':await api('cambiarPin',tok(),val('np'));toast('PIN actualizado.');f.reset();break;
      case 'f-permiso':await api('darPermiso',tok(),{maestroId:val('gt'),alumnoId:val('ga'),duracion:permDur});toast(permDur==='siempre'?'Permiso permanente dado. Puedes quitarlo cuando quieras.':'Permiso dado por hoy.');await cargar();break;
      case 'f-permalumno':await api('darPermiso',tok(),{maestroId:val('pm'),alumnoId:sub().id,duracion:permDur});toast('Permiso dado.');await cargarSub();break;
      case 'f-permdir':await api('darPermiso',tok(),{maestroId:val('pdm'),grupo:val('pdg'),duracion:permDur});toast('Permiso dado.');await cargarSub();break;
      case 'f-horario':{const r=await api('guardarConfig',tok(),{horaSalida:val('hs')});D.resumen&&(D.resumen.horaSalida=r.horaSalida);toast('Hora de salida: '+r.horaSalida);atras();break}
      case 'f-alumno':await api('editarAlumno',tok(),{id:sub().id,nombre:val('en'),curp:val('ec'),grupo:val('eg'),transporte:val('etr')});toast('Cambios guardados.');D.lista=null;await cargarSub();break;
      case 'f-familia':await api('editarFamilia',tok(),{id:f.dataset.id,tutor:val('ft'),pin:val('fp'),correo:val('fc'),telefono:val('fte'),acuerdo:$('fac').checked,estadistica:val('fes')});toast('Familia actualizada.');await cargarSub();break;
      case 'f-alta':{const r=await api('altaAlumno',tok(),{nombre:val('an'),curp:val('ac'),grupo:val('ag'),transporte:val('atr'),curpHermano:val('ah'),tutor:val('at'),correo:val('ae'),telefono:val('aw')});
        toast(r.hermano?'Alumno agregado a la cuenta de su hermano.':'Alumno dado de alta. PIN de la familia: '+r.pin);grupoSel=val('ag');D.lista=null;D.ficha=null;pila[pila.length-1]={t:'ficha',id:r.id};render();await cargarSub();break}
      case 'f-maestro':{const r=await api('guardarMaestro',tok(),{id:f.dataset.id||'',nombre:val('mn'),grupo:val('mg'),tipo:val('mt'),usuario:val('mu'),contrasena:val('mc'),correo:val('me')});
        toast('Guardado. Contraseña: '+r.contrasena);D.maestros=await api('listaMaestros',tok());atras();break}
      case 'f-est':D.estF={desde:val('ed'),hasta:val('eh')};D.est=null;render();D.est=await api('estadisticas',tok(),D.estF);render();break;
      case 'f-reporte':D.filtro=filtroRep();D.reporte=await api('reporte',tok(),D.filtro);render();break;
      case 'f-clave':await api('cambiarClaveDir',tok(),val('ka'),val('kn'));toast('Contraseña cambiada.');atras();break;
      case 'f-ciclo':{const r=await api('cerrarCicloDir',tok(),val('cic'));toast(`Ciclo cerrado: ${r.subieron} subieron de grado, ${r.egresaron} egresaron.`);atras();break}
    }
  });
});

/* ---------- Inicio ---------- */
render();
if(ses)cargar();
</script>
