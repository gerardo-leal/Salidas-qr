<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salidas QR">
<title>Salidas QR · Leal Leal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Lexend:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* Una columna para celular; barra inferior por rol; acciones principales como botones grandes */
:root{
  --bg:#eef2f4; --card:#fff; --fg:#17232b; --muted:#5a6b75; --line:#d3dde2;
  --accent:#0f6b6e; --accent-soft:#dbefee; --mark:#f2b134; --ok:#2e7d4f; --ok-soft:#dff1e6; --bad:#b3402f; --bad-soft:#f8e1dc;
  --warn:#8a5a00; --warn-soft:#fbefd5;
  --display:"Bitter",Georgia,serif; --body:"Lexend",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10181c; --card:#18242a; --fg:#e4ecef; --muted:#93a6af; --line:#2a3a42;
  --accent:#4cc0c2; --accent-soft:#173a3c; --ok:#5cc28a; --ok-soft:#173326; --bad:#e8826f; --bad-soft:#3a1f1a;
  --warn:#f2b134; --warn-soft:#3a2e12; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body{padding:calc(12px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
body.sinbarra{padding-bottom:32px}
body.noscroll{overflow:hidden}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:1.25rem;margin:0;line-height:1.2;text-wrap:balance}
h2{font-family:var(--display);font-size:1.08rem;margin:0}
h3{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top small{display:block;font-family:var(--body);font-size:.78rem;color:var(--muted);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{font:inherit;font-size:.95rem;font-weight:500;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.warn{color:var(--bad);border-color:var(--bad)}
.btn.full{width:100%}
.btn.big{min-height:56px;font-size:1.05rem}
.btn.xl{min-height:68px;font-size:1.12rem;border-radius:18px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.55}
.btn svg{width:24px;height:24px;flex:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
input,select{font:inherit;font-size:16px;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);width:100%}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:500}
.form{display:flex;flex-direction:column;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none;object-fit:cover;background:var(--accent);font-size:.9rem}
.av.lg{width:84px;height:84px;border-radius:16px;font-size:1.4rem}
.av.xl{width:96px;height:96px;border-radius:18px;font-size:1.6rem}
.av.gr{background:var(--accent-soft);color:var(--accent);font-size:.8rem}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
div.item{cursor:default}
.item:last-child{border-bottom:0}
.item b{display:block;font-weight:500}
.item span.s{display:block;font-size:.84rem;color:var(--muted)}
.chev{color:var(--muted);flex:none}
.pill{font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill svg{width:14px;height:14px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.gris{background:var(--bg);color:var(--muted)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.88rem;letter-spacing:.03em;word-break:break-all}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qr{background:#fff;padding:12px;border-radius:14px;line-height:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{font:inherit;font-size:.9rem;font-weight:500;min-height:40px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);white-space:nowrap;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.chips.envolver{flex-wrap:wrap;overflow:visible}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{font:inherit;font-size:.9rem;font-weight:500;min-height:44px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px}
.seg button svg{width:20px;height:20px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grupos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:560px){.grupos{grid-template-columns:repeat(6,1fr)}}
.grupos button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.grupos b{font-family:var(--display);font-size:1.1rem}
.grupos span{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{border:2px solid var(--ok)}
.result.no{border-color:var(--bad)}
.pick{display:flex;flex-direction:column;gap:10px}
.pick label,.chk{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}
.pick label:has(input:checked),.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pick input,.chk input{width:24px;min-height:24px;height:24px;flex:none;accent-color:var(--accent)}
.chk.off{cursor:default;opacity:.75}
.muted{color:var(--muted);font-size:.86rem}
.nota{font-size:.86rem;background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 12px}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.cargando{text-align:center;color:var(--muted);padding:40px 10px}
.salida{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--line)}
.salida:last-child{border-bottom:0}
.salida .h{font-variant-numeric:tabular-nums;font-weight:600}
.hecho{text-align:center;align-items:center;border:2px solid var(--ok)}
.check{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.check svg{width:44px;height:44px}
.horag{font-family:var(--display);font-size:2.3rem;font-variant-numeric:tabular-nums;line-height:1}
details summary{cursor:pointer;color:var(--accent);font-weight:500;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:10;
  padding:4px max(6px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
nav.bar div{max-width:720px;margin:0 auto;display:flex}
nav.bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:.72rem;font-weight:500;background:none;border:0;color:var(--muted);padding:8px 0 6px;cursor:pointer;min-height:56px}
nav.bar button[aria-current="page"]{color:var(--accent)}
nav.bar svg{width:24px;height:24px}
.back{display:flex;align-items:center;gap:6px;font:inherit;font-weight:500;background:none;border:0;color:var(--accent);padding:6px 0;cursor:pointer;min-height:44px;align-self:flex-start}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:.92rem;width:max-content;max-width:calc(100% - 28px);z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#cam{position:fixed;inset:0;z-index:30;background:#0b1114;color:#fff;display:flex;flex-direction:column;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#cam .camtop{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:720px;width:100%;margin:0 auto}
#cam .camtop b{font-size:1.05rem}
#cam .btn{background:#1f2c33;border-color:#2f4049;color:#fff}
#cam .btn.pri{background:#4cc0c2;border-color:#4cc0c2;color:#0b1114}
#cam input{background:#1f2c33;border-color:#2f4049;color:#fff}
#cam .cuerpo{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;max-width:720px;width:100%;margin:0 auto;overflow:auto}
#lector{width:100%;border-radius:16px;overflow:hidden;background:#000}
#lector video{width:100%!important;border-radius:16px}
.login{max-width:440px;margin:0 auto;width:100%;padding-top:3vh}
.login h1{font-size:1.45rem}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.tabs3 button{font:inherit;font-size:.85rem;font-weight:500;min-height:40px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer}
.tabs3 button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pass{position:relative}
.pass button{position:absolute;right:6px;bottom:6px;min-height:34px;padding:4px 10px;font:inherit;font-size:.8rem;border:0;border-radius:8px;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="cargando">Cargando…</div></div>
<nav class="bar" id="bar" hidden><div id="barin"></div></nav>
<div id="cam" hidden>
  <div class="camtop"><b>Apunta al código QR</b><button class="btn sm" data-a="cerrarcam">Cerrar</button></div>
  <div class="cuerpo">
    <div id="lector"></div>
    <form id="f-scan" class="row"><input id="qrin" class="grow" placeholder="O escribe el código: QR-…" autocapitalize="characters" spellcheck="false" aria-label="Código QR"><button class="btn pri" type="submit">Buscar</button></form>
  </div>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script>
/* ===================== CONFIGURACIÓN ===================== */
// URL de la aplicación web de Apps Script (termina en /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbxW_SUxXac2-4rzW6YwGE_CDK0a6Clm9JqKHfpRwqQZhOpyqftlCiDN186-Y6kALiMeZw/exec';
const ESCUELA = 'Escuela Primaria Profesor Gerardo Guadalupe Leal Leal';
/* ========================================================= */

const GRUPOS=['1°A','1°B','2°A','2°B','3°A','3°B','4°A','4°B','5°A','5°B','6°A','6°B'];
const PARENTESCOS=['Mamá','Papá','Abuela','Abuelo','Tía','Tío','Hermano(a) mayor de edad','Padrastro','Madrastra','Otro'];
const MOTIVOS=['Cita médica','Se sintió mal','Asunto familiar','Otro'];

/* ---------- Íconos ---------- */
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
  home:svg('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'),
  list:svg('<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>'),
  scan:svg('<path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/><path d="M7 12h10"/>'),
  people:svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14a6 6 0 013.5 6"/>'),
  more:svg('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'),
  qr:svg('<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/>'),
  clock:svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>'),
  user:svg('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>'),
  key:svg('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>'),
  bus:svg('<rect x="4" y="3" width="16" height="14" rx="2"/><path d="M4 11h16M8 17v3M16 17v3"/><circle cx="8" cy="14" r=".6"/><circle cx="16" cy="14" r=".6"/>'),
  check:svg('<path d="M5 12.5l4.5 4.5L19 7"/>'),
  person:svg('<circle cx="12" cy="7.5" r="3.5"/><path d="M5 21v-1a7 7 0 0114 0v1"/>'),
  chev:'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>'
};

/* ---------- Utilidades ---------- */
const $=id=>document.getElementById(id);
const val=id=>($(id)?$(id).value:'').trim();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=n=>String(n||'').split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const nom1=n=>String(n||'').split(' ')[0];
const av=(n,foto,c='')=>foto?`<img class="av ${c}" src="${foto}" alt="Foto de ${esc(n)}">`:`<div class="av ${c}" aria-hidden="true">${esc(ini(n))}</div>`;
const guardar=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const leer=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const tok=()=>ses&&ses.token;
const hoyISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fechaBonita=f=>{if(!f)return'';if(f===hoyISO())return'Hoy';const[y,m,d]=f.split('-');return`${+d}/${+m}/${y}`};
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,4000)}
const qrUrl=c=>location.origin+location.pathname+'?qr='+encodeURIComponent(c);
const pillTipo=t=>t==='Temprana'?'<span class="pill warn">Temprana</span>':t==='Transporte'?`<span class="pill">${I.bus}Transporte</span>`:'';
const textoSalida=s=>s.tipo==='Transporte'?`Subió al ${esc(s.recogio).replace('Transporte','transporte')}`:`Con ${esc(s.recogio)}${s.parentesco?' ('+esc(s.parentesco)+')':''}`;

async function api(fn,...args){
  if(!/^https:\/\/script\.google\.com\//.test(API_URL))throw new Error('Falta configurar API_URL en index.html.');
  let r;
  try{r=await fetch(API_URL,{method:'POST',body:JSON.stringify({fn,args})})}
  catch(e){throw new Error('Sin conexión. Revisa tu internet e intenta de nuevo.')}
  let j;try{j=await r.json()}catch(e){throw new Error('El servidor no respondió bien. Intenta de nuevo.')}
  return respuesta(j);
}
function respuesta(j){
  if(!j.ok){
    if(/sesión terminó/.test(j.error))cerrarSesion(true);
    if(j.error==='Acción no válida.')throw new Error('Falta actualizar el servidor en Google Drive (pasos en el README de GitHub).');
    throw new Error(j.error);
  }
  return j.data;
}
async function hacer(btn,fn){
  const txt=btn&&btn.innerHTML;if(btn){btn.disabled=true;btn.innerHTML='Un momento…'}
  try{return await fn()}catch(e){toast(e.message||String(e))}
  finally{if(btn&&document.body.contains(btn)){btn.disabled=false;btn.innerHTML=txt}}
}
function leerFoto(file){return new Promise((ok,mal)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',0.82))};img.onerror=()=>mal(new Error('No se pudo leer la foto.'));img.src=r.result};r.onerror=()=>mal(new Error('No se pudo leer la foto.'));r.readAsDataURL(file)})}

/* ---------- Estado ---------- */
let ses=leer('sesion');
let tab='', pila=[], D={}, confirmar=null, lector=null, E=null, alCerrar=null;
let grupoSel=leer('grupoSel')||'1°A';
let rolLogin=leer('ultimoRol')||'padre';
let filtro='todos', hoyFiltro='mio', permDur='siempre';
const params=new URLSearchParams(location.search);
let qrPendiente=(params.get('qr')||'').toUpperCase();
if(qrPendiente){history.replaceState(null,'',location.pathname);if(!ses)rolLogin='maestro'}
const app=$('app');
const sub=()=>pila[pila.length-1]||null;

const TABS={
  padre:[['hijos','Mis hijos',I.qr],['personas','Autorizados',I.people],['historial','Historial',I.clock],['cuenta','Cuenta',I.user]],
  maestro:[['salidas','Salidas',I.scan],['permisos','Permisos',I.key],['hoy','Hoy',I.clock]],
  dir:[['inicio','Inicio',I.home],['alumnos','Alumnos',I.list],['escanear','Escanear',I.scan],['maestros','Maestros',I.people],['mas','Más',I.more]]
};

function cerrarSesion(silencio){cerrarCamara();if(ses)api('salir',ses.token).catch(()=>{});ses=null;guardar('sesion',null);tab='';pila=[];D={};E=null;render();if(!silencio)toast('Sesión cerrada.')}

/* ---------- Navegación ---------- */
async function ir(t){await cerrarCamara();tab=t;pila=[];E=null;confirmar=null;render();window.scrollTo(0,0);await cargar()}
function abrir(s){confirmar=null;pila.push(s);history.pushState({sub:pila.length},'');render();window.scrollTo(0,0);cargarSub()}
async function cerrarSub(){
  if(!pila.length)return;
  const s=pila.pop();if(s.t==='entrega')E=null;confirmar=null;render();
  if(pila.length)await cargarSub();else await cargar();
  const f=alCerrar;alCerrar=null;if(f)f();
}
window.addEventListener('popstate',()=>{if(!$('cam').hidden){cerrarCamara();return}if(pila.length)cerrarSub()});
function atras(fn){alCerrar=fn||null;if(history.state&&history.state.sub)history.back();else cerrarSub()}

async function cargar(){
  if(!ses)return;
  try{
    const r=ses.rol;
    if(r==='padre')D.padre=await api('datosPadre',tok());
    if(r==='maestro')D.maestro=await api('datosMaestro',tok());
    if(r==='dir'){
      if(tab==='inicio'||tab==='mas')D.resumen=await api('resumenDir',tok());
      if(tab==='alumnos'&&!D.busqueda)D.lista=await api('listaGrupo',tok(),grupoSel);
      if(tab==='maestros')D.maestros=await api('listaMaestros',tok());
    }
  }catch(e){toast(e.message);return}
  if(!pila.length)render();
  if(qrPendiente&&ses&&ses.rol!=='padre'){const q=qrPendiente;qrPendiente='';abrirEntrega({qr:q})}
}
async function cargarSub(){
  const s=sub();if(!s)return;
  try{
    if(s.t==='entrega'&&E&&!E.res){const r=E.o.qr?await api('buscarQR',tok(),E.o.qr):await api('abrirAlumno',tok(),E.o.id);iniciarEntrega(r)}
    if(s.t==='ficha')D.ficha=await api('fichaAlumno',tok(),s.id);
    if(s.t==='maestro'&&!D.maestros)D.maestros=await api('listaMaestros',tok());
    if(s.t==='transporte')D.trans=await api('transporteDir',tok());
    if(s.t==='permisosDir')D.perm=await api('listaPermisos',tok());
    if(s.t==='horario'&&!D.resumen)D.resumen=await api('resumenDir',tok());
  }catch(e){toast(e.message);return}
  if(sub()===s)render();
}

/* ---------- Render ---------- */
function render(){
  const bar=$('bar');
  if(!ses){bar.hidden=true;document.body.classList.add('sinbarra');app.innerHTML=vLogin();return}
  if(!tab)tab=TABS[ses.rol][0][0];
  const s=sub();
  bar.hidden=!!s;document.body.classList.toggle('sinbarra',!!s);
  $('barin').innerHTML=TABS[ses.rol].map(([k,l,ic])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':''}>${ic}<span>${l}</span></button>`).join('');
  let h='';
  if(s){h=`<button class="back" data-a="atras">${I.back} Atrás</button>`+(SUB[s.t]?SUB[s.t](s):'')}
  else{
    const titulo=TABS[ses.rol].find(x=>x[0]===tab)[1];
    h=`<header class="top"><h1>${esc(titulo)}<small>${esc(ses.nombre)}</small></h1><button class="btn sm" data-a="salir">Salir</button></header>`;
    h+=(V[ses.rol+'_'+tab]||(()=>''))();
  }
  app.innerHTML=h;
  app.querySelectorAll('.qr[data-code]').forEach(el=>{try{new QRCode(el,{text:qrUrl(el.dataset.code),width:200,height:200,colorDark:'#17232b',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent=el.dataset.code}});
}

function abrirEntrega(o){
  E={o,res:null,persona:'',transporte:false,hermanos:{},motivo:'',hecho:null,via:o.qr?'QR':'Lista'};
  if(sub()&&sub().t==='entrega'){render();cargarSub()}else abrir({t:'entrega'});
}
function iniciarEntrega(r){
  E.res=r;if(!r.valido)return;
  E.transporte=!!r.alumno.transporte&&!r.salida;
  E.persona=r.personas.length===1?r.personas[0].id:'';
  E.hermanos={};
  r.hermanos.forEach(h=>{if(h.permiso!=='no'&&!h.salida)E.hermanos[h.id]=['siempre','propio','dir'].indexOf(h.permiso)>=0});
}
const etiquetaPermiso={propio:'Tu grupo',hoy:'Permiso de hoy',siempre:'Permiso permanente',dir:'Dirección',no:'Sin permiso'};
function hermanosElegibles(){return E.res.hermanos.filter(h=>h.permiso!=='no'&&!h.salida&&(!E.transporte||h.transporte))}
function botonRegistrar(){
  const n=1+hermanosElegibles().filter(h=>E.hermanos[h.id]).length;
  return E.transporte?`${I.bus} Entregar al transporte${n>1?' ('+n+' alumnos)':''}`:`Registrar salida${n>1?' de '+n+' alumnos':''}`;
}
const SUB={
entrega(){
  if(!E||!E.res)return cargando;
  const r=E.res;
  if(!r.valido)return `<section class="card result no"><h2>Código no válido</h2><p class="muted">Puede ser un código QR que la familia ya cambió. Pide identificación y avisa a la dirección.</p></section><button class="btn pri big full" data-a="siguiente">${I.scan} Escanear otro</button>`;
  if(E.hecho)return vHecho();
  const a=r.alumno,ok=r.permiso!=='no';
  let h=`<section class="card result ${ok?'':'no'}"><div class="row">${av(a.nombre,a.foto,'lg')}<div class="grow"><h1>${esc(a.nombre)}</h1><span class="muted">${esc(a.grupo)} · ${esc(a.titular)}</span></div></div>
  <div class="row"><span class="pill ${ok?'ok':'bad'}">${etiquetaPermiso[r.permiso]}</span>${a.transporte?`<span class="pill">${I.bus}${esc(a.transporte)}</span>`:''}${E.via==='Lista'?'<span class="pill gris">Sin QR</span>':''}</div></section>`;
  if(r.salida){
    h+=`<section class="card"><h2>Ya salió hoy a las ${esc(r.salida.hora)}</h2><p>${textoSalida(r.salida)} ${pillTipo(r.salida.tipo)}</p><p class="muted">Entregó ${esc(r.salida.entrego)}${r.salida.motivo?' · Motivo: '+esc(r.salida.motivo):''}</p>
    ${r.puedeDeshacer?botonConfirmar('deshacer','Deshacer esta salida','deshacer',`data-ids="${a.id}"`,'Se anula la salida y la familia recibe un aviso de corrección. El alumno vuelve a aparecer en la escuela.','btn warn full'):''}</section>`;
    return h;
  }
  if(!ok)return h+`<section class="card"><p>${esc(nom1(a.nombre))} es de ${esc(a.grupo)}. Para entregarlo, ${esc(a.titular)} debe darte permiso en su sección <b>Permisos</b> (solo hoy o siempre).</p></section>`;
  if(E.via==='Lista'&&!E.transporte)h+=`<p class="nota">Sin código QR: verifica la identificación de quien recoge.</p>`;
  if(a.transporte)h+=`<div class="seg" role="group" aria-label="Cómo se va">${[['persona','Lo recogen',I.person],['transporte','Transporte · '+a.transporte,I.bus]].map(([k,l,ic])=>`<button aria-pressed="${(k==='transporte')===E.transporte}" data-a="modo" data-val="${k}">${ic}${esc(l)}</button>`).join('')}</div>`;
  if(!E.transporte){
    h+=r.personas.length?`<section class="card"><h3>¿Quién lo recoge?</h3><div class="pick">${r.personas.map((p,i)=>`<label for="pk${i}"><input type="radio" name="pk" id="pk${i}" value="${p.id}" ${E.persona===p.id?'checked':''}>${av(p.nombre,p.foto,'xl')}<span class="grow"><b>${esc(p.nombre)}</b><br><span class="muted">${esc(p.parentesco)}</span></span></label>`).join('')}</div></section>`
      :`<section class="card result no"><p>Esta familia no tiene personas autorizadas registradas. Comunícate con la dirección.</p></section>`;
  }
  if(r.hermanos.length){
    h+=`<section class="card"><h3>Hermanos</h3><div class="pick">${r.hermanos.map(x=>{
      if(x.salida)return `<div class="chk off"><span class="grow"><b>${esc(x.nombre)}</b> · ${esc(x.grupo)}<br><span class="muted">Ya salió ${esc(x.salida.hora)}</span></span></div>`;
      if(x.permiso==='no')return `<div class="chk off"><span class="grow"><b>${esc(x.nombre)}</b> · ${esc(x.grupo)}<br><span class="muted">Para entregarlo necesitas permiso de ${esc(x.titular)}</span></span></div>`;
      if(E.transporte&&!x.transporte)return `<div class="chk off"><span class="grow"><b>${esc(x.nombre)}</b> · ${esc(x.grupo)}<br><span class="muted">No usa transporte</span></span></div>`;
      return `<label class="chk" for="hm${x.id}"><input type="checkbox" id="hm${x.id}" data-h="${x.id}" ${E.hermanos[x.id]?'checked':''}><span class="grow"><b>También sale ${esc(x.nombre)}</b><br><span class="muted">${esc(x.grupo)} · ${etiquetaPermiso[x.permiso]}</span></span></label>`;
    }).join('')}</div></section>`;
  }
  if(r.temprana&&!E.transporte){
    h+=`<section class="card" style="border-color:var(--mark)"><h2>Salida temprana</h2><p class="muted">Es antes de las ${esc(r.horaSalida)}. Elige el motivo:</p>
    <div class="chips envolver">${MOTIVOS.map(m=>`<button aria-pressed="${E.motivo===m}" data-a="motivo" data-val="${esc(m)}">${esc(m)}</button>`).join('')}</div>
    ${E.motivo==='Otro'?`<label class="f" for="motivoOtro">¿Cuál?<input id="motivoOtro" autocomplete="off"></label>`:''}</section>`;
  }
  return h+`<button class="btn pri big full" data-a="registrar" data-id="${a.id}" id="btnreg" ${!E.transporte&&!r.personas.length?'disabled':''}>${botonRegistrar()}</button>`;
},
ficha(s){
  const d=D.ficha;if(!d||d.alumno.id!==s.id)return cargando;
  const a=d.alumno,f=d.familia;
  return `<section class="card"><div class="row">${av(a.nombre,a.foto,'xl')}<div class="grow"><h1>${esc(a.nombre)}</h1><span class="muted">${esc(a.grupo)}</span> ${a.transporte?`<span class="pill">${I.bus}${esc(a.transporte)}</span>`:''}${a.activo?'':' <span class="pill bad">Dado de baja</span>'}</div></div>
  ${a.activo?`<button class="btn pri big full" data-a="entrega" data-id="${a.id}">Dar salida</button>`:''}
  <label class="btn full" for="fa">Cambiar foto del alumno<input id="fa" type="file" accept="image/*" hidden></label></section>
  <section class="card"><h3>Código QR</h3><div class="qrwrap"><div class="qr" data-code="${esc(a.qr)}"></div><span class="code muted">${esc(a.qr)}</span></div>
  ${botonConfirmar('qr','Cambiar código QR','nuevoqr',`data-id="${a.id}"`,'El código actual dejará de funcionar.')}</section>
  <form class="card form" id="f-alumno"><h3>Datos del alumno</h3>
  <label class="f" for="en">Nombre completo<input id="en" value="${esc(a.nombre)}"></label>
  <label class="f" for="ec">CURP<input id="ec" value="${esc(a.curp)}" maxlength="18" autocapitalize="characters"></label>
  <label class="f" for="eg">Grupo<select id="eg">${GRUPOS.map(g=>`<option ${g===a.grupo?'selected':''}>${g}</option>`).join('')}</select></label>
  <label class="f" for="etr">Transporte escolar<input id="etr" list="rutas" value="${esc(a.transporte)}" placeholder="Vacío si no usa transporte (ej. Ruta 1)" autocomplete="off"></label>
  <datalist id="rutas">${d.rutas.map(r=>`<option value="${esc(r)}">`).join('')}</datalist>
  <button class="btn pri full" type="submit">Guardar cambios</button></form>
  <form class="card form" id="f-familia" data-id="${esc(f.id)}"><h3>Familia</h3>
  <label class="f" for="ft">Tutor<input id="ft" value="${esc(f.tutor)}"></label>
  <label class="f" for="fp">PIN de acceso<input id="fp" value="${esc(f.pin)}" inputmode="numeric" maxlength="6"></label>
  <label class="f" for="fc">Correo para avisos<input id="fc" type="email" inputmode="email" value="${esc(f.correo)}"></label>
  <label class="f" for="fte">Teléfono<input id="fte" type="tel" value="${esc(f.telefono)}"></label>
  <p class="muted">El padre entra con el CURP del hijo mayor inscrito y este PIN.</p>
  <div class="row"><button class="btn pri grow" type="submit">Guardar</button><button class="btn grow" type="button" data-a="pinnuevo" data-id="${esc(f.id)}">PIN al azar</button></div>
  ${d.hermanos.length?`<h3>Hermanos</h3><div class="list">${d.hermanos.map(h=>`<button class="item" type="button" data-a="ficha" data-id="${h.id}"><span class="grow"><b>${esc(h.nombre)}</b><span class="s">${esc(h.grupo)}</span></span>${I.chev}</button>`).join('')}</div>`:''}</form>
  <section class="card"><h3>Personas autorizadas</h3><div class="list">${d.personas.map(p=>`<div class="item">${av(p.nombre,p.foto,'lg')}<div class="grow"><b>${esc(p.nombre)}</b><span class="s">${esc(p.parentesco)}</span></div>
  ${confirmar==='p'+p.id?`<button class="btn warn sm" data-a="quitarp" data-id="${p.id}">Confirmar</button>`:`<button class="btn sm" data-a="pedir" data-k="p${p.id}">Quitar</button>`}</div>`).join('')||'<p class="muted">Sin personas autorizadas. Agrégalas con los datos de la hoja de autorización.</p>'}</div></section>
  ${formPersona(f.id)}
  <form class="card form" id="f-permalumno"><h3>Otros maestros que lo pueden entregar</h3>
  ${d.permisos.length?`<div class="list">${d.permisos.map(p=>filaPermiso(p,esc(p.maestro)+` <span class="muted">(${esc(p.maestroGrupo)})</span>`,p.alumno?'Solo a este alumno':'Todo el grupo')).join('')}</div>`:'<p class="muted">Solo su maestro y la dirección.</p>'}
  <label class="f" for="pm">Dar permiso a<select id="pm">${d.maestros.map(m=>`<option value="${m.id}">${esc(m.nombre)} · ${esc(m.grupo)}</option>`).join('')}</select></label>
  ${segDuracion()}<button class="btn full" type="submit">Dar permiso para este alumno</button></form>
  <section class="card"><h3>Últimas salidas</h3>${listaSalidas(d.salidas,'Sin salidas registradas.')}</section>
  ${botonConfirmar('baja',a.activo?'Dar de baja':'Reactivar alumno','baja',`data-id="${a.id}" data-val="${a.activo?0:1}"`,a.activo?'El alumno dejará de aparecer en listas y su QR dejará de funcionar.':'El alumno volverá a estar activo.',`btn ${a.activo?'warn':''} full`)}`;
},
alta(){
  return `<h1>Dar de alta alumno</h1><form class="card form" id="f-alta">
  <label class="f" for="an">Nombre completo<input id="an" required autocomplete="off"></label>
  <label class="f" for="ac">CURP<input id="ac" maxlength="18" required autocapitalize="characters" spellcheck="false"></label>
  <label class="f" for="ag">Grupo<select id="ag">${GRUPOS.map(g=>`<option ${g===grupoSel?'selected':''}>${g}</option>`).join('')}</select></label>
  <label class="f" for="atr">Transporte escolar<input id="atr" placeholder="Vacío si no usa transporte (ej. Ruta 1)" autocomplete="off"></label>
  <h3>¿Tiene hermanos inscritos?</h3>
  <input type="hidden" id="ah"><div id="ahsel"></div>
  <label class="f" for="ahq">Buscar hermano (déjalo vacío si es familia nueva)<input id="ahq" type="search" autocomplete="off" placeholder="Nombre del hermano"></label>
  <div id="ahres" class="list"></div>
  <div id="famnueva" class="form"><h3>Familia nueva</h3>
  <label class="f" for="at">Nombre del tutor<input id="at" autocomplete="off"></label>
  <label class="f" for="ae">Correo para avisos<input id="ae" type="email" inputmode="email" autocomplete="off"></label>
  <label class="f" for="aw">Teléfono<input id="aw" type="tel" autocomplete="off"></label></div>
  <button class="btn pri big full" type="submit">Dar de alta</button></form>`;
},
maestro(s){
  const m=s.id&&D.maestros?D.maestros.find(x=>x.id===s.id):null;
  if(s.id&&!m)return cargando;
  const libres=GRUPOS.filter(g=>!(D.maestros||[]).some(x=>x.grupo===g&&(!m||x.id!==m.id)));
  return `<h1>${m?'Editar maestro':'Agregar maestro'}</h1><form class="card form" id="f-maestro" data-id="${m?esc(m.id):''}">
  <label class="f" for="mn">Nombre completo<input id="mn" required value="${esc(m?m.nombre:'')}"></label>
  <label class="f" for="mg">Grupo<select id="mg">${libres.map(g=>`<option ${m&&m.grupo===g?'selected':''}>${g}</option>`).join('')}</select></label>
  <label class="f" for="mu">Usuario<input id="mu" required autocapitalize="none" spellcheck="false" value="${esc(m?m.usuario:'')}"></label>
  <label class="f" for="mc">Contraseña<input id="mc" value="${esc(m?m.contrasena:'')}" placeholder="Déjala vacía para generar una"></label>
  <label class="f" for="me">Correo<input id="me" type="email" inputmode="email" value="${esc(m?m.correo:'')}"></label>
  <button class="btn pri big full" type="submit">Guardar</button></form>
  ${m?botonConfirmar('delm','Eliminar maestro','delmaestro',`data-id="${m.id}"`,esc(m.nombre)+' ya no podrá entrar.','btn warn full'):''}`;
},
transporte(){
  const d=D.trans;if(!d)return cargando;
  if(!d.length)return `<h1>Transporte</h1><section class="card"><p>Ningún alumno tiene transporte asignado.</p><p class="muted">Asígnalo en la ficha del alumno (campo <b>Transporte escolar</b>) o con la columna <b>Transporte</b> al importar el Excel.</p></section>`;
  return `<h1>Transporte</h1>`+d.map(r=>{
    const pend=r.alumnos.filter(a=>!a.salida);
    return `<section class="card"><div class="row"><h2 class="grow">${I.bus.replace('<svg','<svg width="20" height="20" style="vertical-align:-4px"')} ${esc(r.ruta)}</h2><span class="pill ${pend.length?'':'ok'}">${r.alumnos.length-pend.length}/${r.alumnos.length} entregados</span></div>
    <div class="list">${r.alumnos.map(a=>filaAlumno(a,true)).join('')}</div>
    ${pend.length?botonConfirmar('tr'+r.ruta,`Entregar ${pend.length} pendientes de ${esc(r.ruta)}`,'transporte',`data-ids="${pend.map(a=>a.id).join(',')}"`,'Se registrará que subieron al transporte y se avisará a sus familias.','btn pri full'):''}</section>`;
  }).join('');
},
permisosDir(){
  const d=D.perm;if(!d)return cargando;
  return `<h1>Permisos entre maestros</h1>
  <form class="card form" id="f-permdir"><h3>Dar permiso</h3>
  <label class="f" for="pdm">Maestro<select id="pdm">${d.maestros.map(m=>`<option value="${m.id}">${esc(m.nombre)} · ${esc(m.grupo)}</option>`).join('')}</select></label>
  <label class="f" for="pdg">Puede entregar al grupo<select id="pdg">${GRUPOS.map(g=>`<option>${g}</option>`).join('')}</select></label>
  ${segDuracion()}<button class="btn pri full" type="submit">Dar permiso</button>
  <p class="muted">Para un solo alumno (por ejemplo, hermanos), abre su ficha en Alumnos.</p></form>
  <section class="card"><h3>Permisos activos</h3>${d.permisos.length?`<div class="list">${d.permisos.map(p=>filaPermiso(p,esc(p.maestro)+` <span class="muted">(${esc(p.maestroGrupo)})</span>`,p.alumno?esc(p.alumno)+' · '+esc(p.grupo):'Todo '+esc(p.grupo))).join('')}</div>`:'<p class="muted">No hay permisos activos.</p>'}</section>`;
},
horario(){
  const h=D.resumen?D.resumen.horaSalida:'';
  return `<h1>Hora de salida</h1><form class="card form" id="f-horario"><p class="muted">Si un alumno sale antes de esta hora, se registra como <b>salida temprana</b> y se pide el motivo.</p>
  <label class="f" for="hs">Hora normal de salida<input id="hs" type="time" value="${esc(h)}" required></label>
  <button class="btn pri big full" type="submit">Guardar</button></form>`;
},
importar(){
  const p=D.imp;
  let h=`<h1>Importar alumnos</h1><section class="card"><p><b>1.</b> Descarga la plantilla y llénala en dirección: una fila por alumno con <b>nombre</b>, <b>grado y grupo</b>, <b>CURP</b>, <b>si se va en transporte</b> y el <b>CURP de sus hermanos</b> inscritos.</p>
  <a class="btn full" href="plantilla-alumnos.xlsx" download="Plantilla alumnos - Salidas QR.xlsx">Descargar plantilla de Excel</a>
  <p><b>2.</b> Sube el archivo lleno. Antes de importar verás cómo quedó cada alumno.</p>
  <label class="btn pri big full" for="xls">Elegir archivo de Excel<input id="xls" type="file" accept=".xlsx,.xls,.csv" hidden></label></section>`;
  if(p&&p.filas){
    const malos=p.filas.filter(r=>r.aviso).length, fams=p.bloques?p.familias:0;
    h+=`<section class="card"><h2>${p.filas.length} alumnos encontrados</h2>
    ${p.faltan?`<p class="pill bad" style="align-self:flex-start">No encontré la columna: ${esc(p.faltan)}</p>`:''}
    <p class="muted">${fams} familias${p.conHermanos?` · ${p.conHermanos} alumnos con hermanos`:''}${p.enTransporte?` · ${p.enTransporte} en transporte`:''}${malos?` · <b style="color:var(--bad)">${malos} con datos por corregir</b>`:''}</p>
    <div class="tbl"><table><thead><tr><th>Alumno</th><th>Grupo</th><th>CURP</th><th>Transporte</th><th>Hermanos</th><th>${p.res?'Resultado':'Revisión'}</th></tr></thead><tbody>
    ${p.filas.map((r,i)=>`<tr><td>${esc(r.nombre)}</td><td>${esc(r.grupo)}</td><td class="code">${esc(r.curp)}</td><td>${esc(transporteTexto(r))}</td><td>${r.nHermanos?r.nHermanos:''}</td><td>${p.res?(p.res[i]?`<span class="pill ${p.res[i].ok?'ok':'bad'}">${esc(p.res[i].msg)}</span>`:'…'):(r.aviso?`<span class="pill bad">${esc(r.aviso)}</span>`:'<span class="pill ok">Listo</span>')}</td></tr>`).join('')}
    </tbody></table></div>
    ${p.res?`<p><b>${p.res.filter(x=>x&&x.ok).length}</b> dados de alta · <b>${p.res.filter(x=>x&&!x.ok).length}</b> con error. Corrige los errores en el Excel y súbelo otra vez: los que ya entraron se marcarán como ya registrados.</p>`
      :`<button class="btn pri big full" data-a="subirimp" ${p.faltan?'disabled':''}>Importar ${p.filas.length} alumnos</button>${malos?'<p class="muted">Las filas con datos por corregir no se darán de alta; las demás sí.</p>':''}`}</section>`;
  }
  return h;
},

  const f=D.filtro||{};
  return `<h1>Reportes</h1><form class="card form" id="f-reporte">
  <label class="f" for="rg">Grupo<select id="rg"><option value="">Todos</option>${GRUPOS.map(g=>`<option ${f.grupo===g?'selected':''}>${g}</option>`).join('')}</select></label>

},
clave(){
  return `<h1>Contraseña de dirección</h1><form class="card form" id="f-clave">
  <label class="f" for="ka">Contraseña actual<input id="ka" type="password" autocomplete="current-password"></label>
  <label class="f" for="kn">Nueva contraseña (mínimo 6)<input id="kn" type="password" autocomplete="new-password"></label>
  <button class="btn pri big full" type="submit">Cambiar</button></form>`;
},
ciclo(){
  return `<h1>Cerrar ciclo escolar</h1><section class="card"><p>Esto hace cuatro cosas:</p>
  <p class="muted">1. Sube a todos los alumnos un grado (3°A pasa a 4°A).<br>2. Da de baja a los de 6° como egresados. Si tenían hermanos menores, la cuenta pasa al siguiente hermano.<br>3. Guarda el historial de salidas en otra pestaña de la hoja y empieza uno nuevo.<br>4. Quita todos los permisos entre maestros, porque cambian los grupos.</p>
  <p class="muted">Después revisa en Maestros que cada uno tenga su grupo nuevo.</p></section>
  <form class="card form" id="f-ciclo"><label class="f" for="cic">Escribe CERRAR para confirmar<input id="cic" autocapitalize="characters" autocomplete="off"></label>
  <button class="btn warn big full" type="submit">Cerrar ciclo</button></form>`;
}
};

function vHecho(){
  const x=E.hecho;
  const nombres=x.alumnos.map(nom1);
  const lista=nombres.length>1?nombres.slice(0,-1).join(', ')+' y '+nombres.slice(-1):nombres[0];
  return `<section class="card hecho"><div class="check">${I.check}</div><h1>${x.tipo==='Transporte'?'Entregado al transporte':'Salida registrada'}</h1>
  <div class="horag">${esc(x.hora)}</div>

/* ---------- Escáner (pantalla completa) ---------- */
async function abrirCamara(){
  const cam=$('cam');cam.hidden=false;document.body.classList.add('noscroll');$('qrin').value='';
  history.pushState({cam:1},'');
  if(typeof Html5Qrcode==='undefined'){toast('No se pudo cargar el lector. Escribe el código.');return}
  let leido=false;
  try{
    lector=new Html5Qrcode('lector');
    await lector.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*0.7);return{width:s,height:s}}},
      async texto=>{if(leido)return;leido=true;if(navigator.vibrate)navigator.vibrate(80);await cerrarCamara(true);buscar(texto)},()=>{});
  }catch(e){await detenerLector();toast('No se pudo abrir la cámara. Revisa el permiso del navegador o escribe el código.')}
}
async function detenerLector(){if(lector){const l=lector;lector=null;try{await l.stop()}catch(e){}try{l.clear()}catch(e){}}}
async function cerrarCamara(volver){
  await detenerLector();
  if($('cam').hidden)return;
  $('cam').hidden=true;document.body.classList.remove('noscroll');
  if(volver&&history.state&&history.state.cam)history.replaceState(null,'');
}
function buscar(texto){
  let c=String(texto||'').trim();
  try{const u=new URL(c);c=u.searchParams.get('qr')||c}catch(e){}
  c=c.toUpperCase();const m=c.match(/QR-[A-Z0-9]+/);if(m)c=m[0];
  if(!c){toast('Escribe el código.');return}
  abrirEntrega({qr:c});
}

/* ---------- Excel ---------- */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
function transporteTexto(r){const t=String(r.transporte||'').trim();if(/^no$/i.test(t)||(!t&&!r.ruta))return'No';if(/^s[ií]$/i.test(t))return r.ruta||'Sí';return t||r.ruta}
const esCurp=c=>/^[A-Z0-9]{18}$/.test(c);
function leerExcel(file){
  return new Promise((ok,mal)=>{const r=new FileReader();r.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});
    const hoja=wb.SheetNames.find(n=>norm(n)==='alumnos')||wb.SheetNames[0];
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[hoja],{header:1,defval:'',raw:false,blankrows:false});
    const hi=aoa.findIndex(f=>f.some(c=>norm(c).includes('curp')));
    if(hi<0)return mal(new Error('No encontré los encabezados. Usa la plantilla de la escuela (debe tener la columna CURP).'));
    const enc=aoa[hi].map(norm),col=t=>enc.findIndex(t);
    const cN=col(k=>k.includes('nombre')&&!k.includes('tutor')&&!k.includes('padre')&&!k.includes('madre')&&!k.includes('herman'));
    const cC=col(k=>k.includes('curp')&&!k.includes('herman'));
    const cG=col(k=>k.includes('grupo')),cGr=col(k=>k.includes('grado')&&!k.includes('grupo'));
    const cTr=col(k=>k.includes('transporte')&&!k.includes('ruta')),cRu=col(k=>k.includes('ruta'));
    const cH=col(k=>k.includes('herman'));
    const cT=col(k=>(k.includes('tutor')||k.includes('padre')||k.includes('madre'))&&!k.includes('correo')&&!k.includes('mail')&&!k.includes('tel'));
    const cTel=col(k=>k.includes('tel')||k.includes('cel')||k.includes('whats'));
    const cE=col(k=>k.includes('correo')||k.includes('mail'));
    const faltan=[cN<0&&'Nombre del alumno',cC<0&&'CURP',(cG<0&&cGr<0)&&'Grado y grupo'].filter(Boolean).join(', ');
    const v=(f,c)=>c<0?'':String(f[c]==null?'':f[c]).trim();
    const filas=aoa.slice(hi+1).map(f=>{
      let g=v(f,cG);const gr=v(f,cGr);if(gr&&(!g||/^[AB]$/i.test(g)))g=gr+g;
      const curp=v(f,cC).toUpperCase().replace(/\s/g,'');
      const hermanos=v(f,cH).toUpperCase();
      const nH=hermanos.split(/[^A-Z0-9]+/).filter(x=>x.length===18&&x!==curp).length;
      const gm=g.toUpperCase().replace(/\s/g,'').match(/^([1-6])\D*([AB])$/);
      const nombre=v(f,cN);
      const aviso=!nombre?'Falta el nombre':!esCurp(curp)?'CURP debe tener 18 caracteres':!gm?'Revisa grado y grupo':'';
      return{nombre,curp,grupo:gm?gm[1]+'°'+gm[2]:g,transporte:v(f,cTr),ruta:v(f,cRu),hermanos,nHermanos:nH,tutor:v(f,cT),telefono:v(f,cTel),correo:v(f,cE),aviso};
    }).filter(x=>x.nombre||x.curp);
    if(!filas.length)return mal(new Error('El archivo no tiene alumnos. Llena la hoja «Alumnos» a partir de la fila 2.'));
    const bloques=bloquesPorFamilia(filas);
    ok({filas,faltan,bloques,familias:bloques.familias,conHermanos:bloques.conHermanos,enTransporte:filas.filter(x=>transporteTexto(x)!=='No').length});
  }catch(e){mal(new Error('No pude leer el archivo. Guárdalo como .xlsx e intenta de nuevo.'))}};r.onerror=()=>mal(new Error('No pude leer el archivo.'));r.readAsArrayBuffer(file)});
}
// Agrupa a los hermanos para enviarlos juntos al servidor (lotes de hasta 60 alumnos)
function bloquesPorFamilia(filas){
  const padre={},raiz=x=>{while(padre[x]!==x)x=padre[x];return x};
  const unir=(a,b)=>{[a,b].forEach(x=>{if(!padre[x])padre[x]=x});const ra=raiz(a),rb=raiz(b);if(ra!==rb)padre[rb]=ra};
  const keys=filas.map((f,i)=>{const k=f.curp||('#'+i);if(!padre[k])padre[k]=k;f.hermanos.split(/[^A-Z0-9]+/).filter(x=>x.length===18&&x!==f.curp).forEach(h=>unir(k,h));return k});
  const grupos={};keys.forEach((k,i)=>(grupos[raiz(k)]=grupos[raiz(k)]||[]).push(i));
  const lotes=[];let lote=[];
  Object.values(grupos).forEach(g=>{if(lote.length&&lote.length+g.length>60){lotes.push(lote);lote=[]}lote=lote.concat(g)});
  if(lote.length)lotes.push(lote);
  lotes.familias=Object.keys(grupos).length;
  lotes.conHermanos=Object.values(grupos).filter(g=>g.length>1).reduce((n,g)=>n+g.length,0);
  return lotes;
}

  }
  await hacer(b,async()=>{
    switch(a){
      case 'nuevoqr':await api('cambiarQR',tok(),id);confirmar=null;toast('Código QR cambiado. El anterior ya no funciona.');await recargarTodo();break;
      case 'quitarp':await api('quitarPersona',tok(),id);confirmar=null;toast('Persona quitada.');await recargarTodo();break;

      case 'permitirhermano':await api('darPermiso',tok(),{maestroId:b.dataset.m,alumnoId:id,duracion:'siempre'});toast('Listo: puede entregarlo siempre. Lo puedes quitar cuando quieras.');await cargar();break;
      case 'pinnuevo':{const p=await api('restablecerPin',tok(),id);toast('PIN nuevo: '+p);await cargarSub();break}
      case 'baja':await api('editarAlumno',tok(),{id,activo:b.dataset.val==='1'});confirmar=null;toast(b.dataset.val==='1'?'Alumno reactivado.':'Alumno dado de baja.');await cargarSub();break;
      case 'delmaestro':await api('guardarMaestro',tok(),{id,eliminar:true});toast('Maestro eliminado.');D.maestros=null;atras();break;
      case 'transporte':{const ids=b.dataset.ids.split(',');const r=await api('entregarTransporte',tok(),ids);confirmar=null;toast(`${r.n} ${r.n===1?'alumno entregado':'alumnos entregados'} al transporte a las ${r.hora}.`);await recargarTodo();break}
      case 'deshacer':{await api('deshacerSalida',tok(),b.dataset.ids.split(','));confirmar=null;toast('Salida anulada. El alumno sigue en la escuela.');const o=E.res&&E.res.alumno?{id:E.res.alumno.id}:E.o;E=Object.assign(E,{o,res:null,hecho:null});render();await cargarSub();break}
      case 'registrar':{
        const r=E.res;const herm=hermanosElegibles().filter(h=>E.hermanos[h.id]).map(h=>h.id);
        let motivo='';
        if(r.temprana&&!E.transporte){if(!E.motivo){toast('Elige el motivo de la salida temprana.');return}motivo=E.motivo==='Otro'?'Otro: '+(val('motivoOtro')||'sin detalle'):E.motivo}
